[project]
name = "consilith-contracts"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.14.1",
  "pint==0.26.1",
  "rfc8785==0.1.4",
  "cryptography==50.0.2",
  "packaging==26.3",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consilith_contracts"]
