[project]
name = "consilith-plugin-runtime"
version = "0.1.0"
description = "Isolated scientific extension execution and neutral capability RPC"
requires-python = ">=3.12,<3.13"
dependencies = ["consilith-contracts", "packaging==26.3"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consilith_plugin_runtime"]
