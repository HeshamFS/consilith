[importlinter]
root_packages =
    consilith_contracts
    consilith_room
    consilith_referee
    consilith_plugin_runtime
include_external_packages = True

[importlinter:contract:contracts-are-a-leaf]
name = Contracts depend on nothing of ours
type = forbidden
source_modules =
    consilith_contracts
forbidden_modules =
    consilith_room
    consilith_referee

[importlinter:contract:room-layers]
name = Room layers: api -> agents -> protocols -> domain -> platform
type = layers
layers =
    consilith_room.api
    consilith_room.agents
    consilith_room.protocols
    consilith_room.domain
    consilith_room.platform

[importlinter:contract:domain-is-pure]
name = The room domain knows no web framework or wire SDK
type = forbidden
source_modules =
    consilith_room.domain
forbidden_modules =
    fastapi
    starlette
    a2a
    ag_ui
    mcp
    httpx

[importlinter:contract:referee-is-separate]
name = The referee never imports the room
type = forbidden
source_modules =
    consilith_referee
forbidden_modules =
    consilith_room

[importlinter:contract:runtime-neutral]
name = Plugin transport has no implementation or host imports
type = forbidden
source_modules =
    consilith_plugin_runtime
forbidden_modules =
    consilith_room
    consilith_referee
